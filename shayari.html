<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shayari | Alfaaz By Zaman</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <h1>📖 Alfaaz By Zaman</h1>

        <a href="index.html">
            ← Back Home
        </a>

    </header>


    <!-- =====================================
         SHAYARI PAGE
    ====================================== -->

    <main class="shayari-page">

        <div class="shayari-category">

            <h2 id="shayariCategory">
                SHAYARI
            </h2>

        </div>


        <!-- Shayari Card -->

        <section class="single-shayari">

            <div class="shayari-number"
                 id="shayariNumber">

                #1

            </div>


            <div class="shayari-text"
                 id="shayariText">

                Shayari Loading...

            </div>


            <!-- =================================
                 ACTION BUTTONS
            ================================== -->

            <div class="shayari-actions">


                <button
    id="likeButton"
    onclick="likeCurrentShayari()">

    ❤️ Like
    <span id="shayariLikeCount">0</span>

                </button>

                <button
                    id="favoriteButton"
                    onclick="addToFavorites()">

                    ⭐ Favorite

                </button>


                <button
                    id="downloadButton"
                    onclick="downloadCurrentShayari()">

                    ⬇️ Download

                </button>


                <button
                    id="shareButton"
                    onclick="shareCurrentShayari()">

                    ↗️ Share

                </button>

<!-- =================================
     DOWNLOAD STUDIO
================================== -->

<section class="download-studio">

    <h2>🎨 Download Shayari</h2>

    <p class="download-subtitle">
        Apni pasand ka background choose karein
    </p>


    <!-- Background Options -->

    <div class="background-options">

        <button
            class="bg-option active"
            onclick="selectDownloadBackground('default', this)">

            🌙
            <span>Classic</span>

        </button>


        <button
            class="bg-option"
            onclick="selectDownloadBackground('love', this)">

            ❤️
            <span>Love</span>

        </button>


        <button
            class="bg-option"
            onclick="selectDownloadBackground('sad', this)">

            💔
            <span>Sad</span>

        </button>


        <button
            class="bg-option"
            onclick="selectDownloadBackground('dark', this)">

            🖤
            <span>Dark</span>

        </button>


        <button
            class="bg-option"
            onclick="selectDownloadBackground('gold', this)">

            ✨
            <span>Golden</span>

        </button>

    </div>


    <!-- Download Preview -->

    <div
        id="download-preview"
        class="download-preview">

        <div class="download-brand">
            🌙 Alfaaz By Zaman
        </div>

        <div
            id="download-preview-text"
            class="download-preview-text">

            Shayari Loading...

        </div>

        <div class="download-watermark">
            Har Lamha... Har Ehsaas...
        </div>

    </div>


    <!-- Generate -->

    <button
        class="generate-download-btn"
        onclick="generateShayariImage()">

        ⬇️ Download Shayari

    </button>

</section>
            </div>


            <!-- =================================
                 NAVIGATION
            ================================== -->

            <div class="shayari-navigation">


                <button
                    id="previousButton"
                    onclick="previousShayari()">

                    ← Previous

                </button>


                <button
                    id="nextButton"
                    onclick="nextShayari()">

                    Next →

                </button>


            </div>


        </section>


    </main>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div id="toast"
         class="toast">

    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/database.js"></script>

    <script src="js/favorite.js"></script>

    <script src="js/download.js"></script>

    <script src="js/shayari-page.js"></script>


</body>

</html>
